<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/donor.js"></script>
<body>
<div class="container mt-5 col-6">
    <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">Donor Id : </label>
        <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Donor Id : " disabled>
    </div>

    <div class="mb-3">
        <label for="exampleFormControlInput2" class="form-label">Donor Name : </label>
        <input type="text" class="form-control" id="exampleFormControlInput2" placeholder="Donor Name : ">
    </div>

    <div class="mb-3">
        <label for="exampleFormControlInput3" class="form-label">email : </label>
        <input type="email" class="form-control" id="exampleFormControlInput3" placeholder="email : ">
    </div>

    <div class="mb-3">
        <label for="exampleFormControlInput4" class="form-label">Address : </label>
        <input type="text" class="form-control" id="exampleFormControlInput4" placeholder="Address : ">
    </div>

    <div class="mb-3">
        <label for="select-bloodType" class="form-label">Select Blood Type : </label>
        <select id="select-bloodType" class="form-select">
        </select>
    </div><br>

    <div>
        <button type="button" class="btn btn-primary" onclick="saveDonor()">Save</button>
        <button type="button" class="btn btn-secondary" onclick="updateDonor()">Update</button>
        <button type="button" class="btn btn-success" onclick="deleteDonor()">Delete</button>
        <button type="button" class="btn btn-success" onclick="getAllDonor()">Load Table</button>
    </div>

    <div class="mt-3">
        <table class="table">
            <thead>
            <tr>
                <th scope="col">Donor Id</th>
                <th scope="col">Donor Name</th>
                <th scope="col">email</th>
                <th scope="col">Address</th>
                <th scope="col">Blood Type</th>
            </tr>
            </thead>
            <tbody id="DonorTable">

            </tbody>
        </table>

    </div>

</div>
</body>
</html>
