<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/Employee.js"></script>
<body>
<div class="container mt-5 col-6">
    <div class="mb-3">
        <label for="exampleFormControlInput1" class="form-label">Employee Id : </label>
        <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Employee Id : " disabled>
    </div>

    <div class="mb-3">
        <label for="exampleFormControlInput2" class="form-label">Employee Name : </label>
        <input type="text" class="form-control" id="exampleFormControlInput2" placeholder="Employee Name : ">
    </div>

    <div class="mb-3">
        <label for="exampleFormControlInput3" class="form-label">contact : </label>
        <input type="text" class="form-control" id="exampleFormControlInput3" placeholder="contact : ">
    </div>

    <div class="mb-3">
        <label for="exampleFormControlInput4" class="form-label">Address : </label>
        <input type="text" class="form-control" id="exampleFormControlInput4" placeholder="Address : ">
    </div>

    <div class="mb-3">
        <label for="select-bloodBank" class="form-label">Select Blood Bank : </label>
        <select id="select-bloodBank" class="form-select"></select>
    </div>

    <div>
        <button type="button" class="btn btn-primary" onclick="saveEmployee()">Save</button>
        <button type="button" class="btn btn-secondary" onclick="updateEmployee()">Update</button>
        <button type="button" class="btn btn-success" onclick="deleteEmployee()">Delete</button>
        <button type="button" class="btn btn-success" onclick="getAllEmployee()">Load Table</button>
    </div>

    <div class="mt-3">
        <table class="table">
            <thead>
            <tr>
                <th scope="col">Employee Id</th>
                <th scope="col">Employee Name</th>
                <th scope="col">Contact</th>
                <th scope="col">Address</th>
                <th scope="col">Blood_Bank</th>
            </tr>
            </thead>
            <tbody id="EmployeeTable">

            </tbody>
        </table>

    </div>

</div>
</body>
</html>
