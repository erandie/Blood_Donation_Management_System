<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Arial', sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f4;
    }

    .profile-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    .profile-card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 300px;
        width: 100%;
    }

    .profile-card img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
    }

    .profile-card h2 {
        font-size: 22px;
        margin-bottom: 8px;
    }

    .profile-card .role {
        color: #666;
        font-size: 16px;
        margin-bottom: 10px;
    }

    .profile-card .user-id {
        color: #888;
        font-size: 14px;
        margin-bottom: 15px;
    }

    .edit-btn {
        background: #007bff;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
    }

    .edit-btn:hover {
        background: #0056b3;
    }

</style>

<body>
<div class="profile-container">
    <div class="profile-card">
        <img id="profileImage" src="default-profile.png" alt="User Profile">
        <h2 id="userName">John Doe</h2>
        <p class="role" id="userRole">Role: USER</p>
        <p class="user-id" id="userId">User ID: 123</p>
        <button class="edit-btn">Edit Profile</button>
    </div>
</div>
</body>
</html>
