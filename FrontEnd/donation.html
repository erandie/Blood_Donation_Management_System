<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/donation.js"></script>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-lg">
                <h4 class="text-center mb-3">Donation Details</h4>

                <div class="mb-3">
                    <label for="donationID" class="form-label">Donation ID :</label>
                    <input type="text" class="form-control" id="donationID" placeholder="Donation ID : " disabled>
                </div>

                <div class="mb-3">
                    <label for="select-donorID" class="form-label">Donor ID :</label>
                    <select id="select-donorID" class="form-select"></select>
                </div>

                <div class="mb-3">
                    <label for="exampleFormControlInput1" class="form-label">Blood Points :</label>
                    <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Blood Points :">
                </div>

                <div class="mb-3">
                    <label for="select-bloodType" class="form-label">Select Blood Type :</label>
                    <select id="select-bloodType" class="form-select"></select>
                </div>

                <div class="mb-3">
                    <label for="select-empID" class="form-label">Employee ID :</label>
                    <select id="select-empID" class="form-select"></select>
                </div>

                <div class="mb-3">
                    <label for="datePicker" class="form-label">Select Date:</label>
                    <input type="text" id="datePicker" class="form-control">
                </div><br>

                <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-primary" onclick="saveDetails()">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="updateDetails()">Update</button>
                    <button type="button" class="btn btn-danger" onclick="deleteDetails()">Delete</button>
                    <button type="button" class="btn btn-success" onclick="getAllDonations()">Load Table</button>
                </div>

                <div class="mt-3">
                    <table class="table">
                        <thead>
                            <tr>
                                <th scope="col">Donation ID</th>
                                <th scope="col">Donor ID</th>
                                <th scope="col">Blood Points</th>
                                <th scope="col">Blood Type</th>
                                <th scope="col">Employee ID</th>
                                <th scope="col">Date</th>
                            </tr>
                        </thead>
                        <tbody id="donationTable">

                        </tbody>
                    </table>

                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    flatpickr("#datePicker", {
        dateFormat: "Y-m-d"
    });
</script>

</body>
</html>
