<!DOCTYPE html>
<html>
<head>
    <title>Simple Map</title>
    <style>
        #map {
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
<h3>My Google Map</h3>
<div id="map"></div>

<script>
    function initMap() {
        const location = { lat: 7.2906, lng: 80.6337 }; // Example: Kandy
        const map = new google.maps.Map(document.getElementById("map"), {
            zoom: 12,
            center: location,
        });
        new google.maps.Marker({
            position: location,
            map: map,
        });
    }
</script>

<script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDAmVJb4xqmCX1jXJ_yky9vlkEuAEIWDMg&callback=initMap">
</script>
</body>
</html>
