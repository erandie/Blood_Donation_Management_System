<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender</title>

</head>
<body>
<section id="send-email" class="send-email section" style="padding: 60px 0; background-color: #f9f9f9;">

    <!-- Section Title -->
    <div class="container section-title" data-aos="fade-up" style="text-align: center; margin-bottom: 30px;">
        <h2 style="font-size: 36px; font-weight: 600; color: #333;">Email Us</h2>
        <p style="font-size: 16px; color: #777;">Reach out to us for any inquiries or concerns, and we’ll respond as soon as possible!</p>
    </div><!-- End Section Title -->

    <div class="container" data-aos="fade-up" id="emailFormm" data-aos-delay="100" style="max-width: 900px; margin: 0 auto;">

        <form id="emailForm">
            <div class="col-lg-8">
                <div class="row gy-4">

                    <div class="col-md-6">
                        <input type="text" name="name" class="form-control" placeholder="Your Name" id="name" required="">
                    </div>

                    <div class="col-md-6 ">
                        <input type="email" class="form-control" name="email" placeholder="Your Email" id="email" required="">
                    </div>

                    <div class="col-md-12">
                        <input type="text" class="form-control" name="subject" placeholder="Subject" id="subject" required="">
                    </div>

                    <div class="col-md-12">
                        <textarea class="form-control" name="message" rows="6" placeholder="Message" id="message" required=""></textarea>
                    </div>

                    <div class="col-md-12 text-center">
                        <div class="loading">Loading</div>
                        <div class="error-message"></div>
                        <div class="sent-message">Your message has been sent. Thank you!</div>

                        <button type="submit" style="background-color: #D62828FF; color: white; padding: 12px 30px; border: none; border-radius: 100px; font-size: 16px; cursor: pointer; transition: background-color 0.3s;">
                            Send Message
                        </button>

                    </div>
                </div>

                </div>
        </form>
    </div>
</section>

<!-- End Contact Form -->

<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/Email.js"></script>

</body>
</html>
