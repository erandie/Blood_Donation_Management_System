<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #2e2e2e;
        }

        .container {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
        }

        .form-section {
            width: 45%;
        }

        .table-section {
            width: 50%;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 50px;
        }
    </style>
</head>
<body>

<br>
<br>
<br>

<h1>Manage Orders 🛒</h1>

<div class="container">
    <div class="form-section">

        <div class="mb-3">
            <label for="order-customer" class="form-label" style="color: white">Select Customer:</label>
            <select id="order-customer" class="form-select" style="background-color: #646363; border: none">
            </select>
        </div>
        <div class="mb-3">
            <label for="order-item" class="form-label" style="color: white">Select Item:</label>
            <select id="order-item" class="form-select" style="background-color: #646363; border: none">
            </select>
        </div>

        <div class="mb-3">
            <label for="qty-on-hand" class="form-label" style="color: white">Quantity On Hand:</label>
            <input type="number" class="form-control" id="qty-on-hand" placeholder="Quantity On Hand" style="background-color: #646363; border: none" readonly>
        </div>

        <div class="mb-3">
            <label for="unit-price" class="form-label" style="color: white">Unit Price:</label>
            <input type="number" class="form-control" id="unit-price" placeholder="Unit Price" style="background-color: #646363; border: none">
        </div>

        <div class="mb-3">
            <label for="order-qty" class="form-label" style="color: white">Quantity:</label>
            <input type="number" class="form-control" id="order-qty" placeholder="Enter Quantity" style="background-color: #646363; border: none" oninput="calculateTotal()">
        </div>

        <div class="mb-3">
            <label for="order-date" class="form-label" style="color: white">Order Date:</label>
            <input type="date" class="form-control" id="order-date" style="background-color: #646363; border: none">
        </div>

        <button type="button" class="btn btn-primary mb-2" onclick="saveOrder()">Save Order 📝</button>
        <button type="button" class="btn btn-primary mb-2" onclick="removeOrder()">Remove Order 📝</button>
    </div>

    <div class="table-section">
        <table class="table" style="border: none">
            <thead class="table-dark">
            <tr>
                <th scope="col">Order ID</th>
                <th scope="col">Customer Name</th>
                <th scope="col">Item</th>
                <th scope="col">Quantity</th>
                <th scope="col">Order Date</th>
                <th scope="col">Total Price</th>
            </tr>
            </thead>
            <tbody id="order-table-body">
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    $(document).ready(function() {
        loadCustomers();
        loadItems();
    });

    function loadCustomers() {
        $.ajax({
            url: "http://localhost:8080/api/v1/customer/get",
            method: "GET",
            success: function(customers) {
                const customerSelect = $("#order-customer");
                customers.forEach(customer => {
                    customerSelect.append(`<option value="${customer.id}">${customer.name}</option>`);
                });
            }
        });
    }

    function loadItems() {
        $.ajax({
            url: "http://localhost:8080/api/v1/item/get",
            method: "GET",
            success: function(items) {
                const itemSelect = $("#order-item");
                items.forEach(item => {
                    itemSelect.append(`<option value="${item.id}" data-price="${item.price}" data-qty="${item.qty}">${item.name}</option>`);
                });
                setItemDetails();
            }
        });
    }

    function setItemDetails() {
        const selectedItem = $("#order-item option:selected");
        const unitPrice = selectedItem.data("price");
        const qtyOnHand = selectedItem.data("qty");

        $("#unit-price").val(unitPrice || 0);
        $("#qty-on-hand").val(qtyOnHand || 0);
    }

    $("#order-item").on("change", function() {
        setItemDetails();
        calculateTotal();
    });

    function calculateTotal() {
        const qty = parseInt($("#order-qty").val()) || 0;
        const unitPrice = parseFloat($("#unit-price").val()) || 0;
        $("#total-price").val((qty * unitPrice).toFixed(2));
    }

    function saveOrder() {
        const order = {
            customerId: $("#order-customer").val(),
            orderDate: $("#order-date").val(),
            total: parseFloat($("#order-qty").val()) * parseFloat($("#unit-price").val()),
            orderDetailsList: [{
                item: $("#order-item").val(),
                qty: $("#order-qty").val(),
                unitPrice: $("#unit-price").val()
            }]
        };

        $.ajax({
            url: "http://localhost:8080/api/v1/order/save",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(order),
            success: function() {
                alert("Order saved successfully! 🎉");
                loadOrders();
            },
            error: function() {
                alert("Failed to save order! ❌");
            }
        });
    }


    function loadOrders() {
        $.ajax({
            url: "http://localhost:8080/api/v1/order/getAll",
            method: "GET",
            success: function(response) {
                const tableBody = $("#order-table-body");
                tableBody.empty();

                response.data.forEach(order => {
                    let itemList = order.orderDetailsList.map(item => `${item.itemName} (x${item.qty})`).join(", ");

                    tableBody.append(`<tr>
                    <td>${order.id}</td>
                    <td>${order.customerName}</td>
                    <td>${itemList}</td>
                    <td>${order.totalQty}</td>
                    <td>${new Date(order.orderDate).toLocaleDateString()}</td>
                    <td>${order.total}</td>
                </tr>`);
                });
            },
            error: function() {
                alert("Failed to load orders! ❌");
            }
        });

    }
</script>

</body>
</html>
