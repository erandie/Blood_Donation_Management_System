<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        :root {
            --primary: #e63946;
            --primary-light: #ff758f;
            --secondary: #457b9d;
            --dark: #1d3557;
            --light: #f1faee;
            --success: #2a9d8f;
            --warning: #e9c46a;
            --danger: #e76f51;
            --white: #ffffff;
            --gray: #f8f9fa;
            --text: #333333;
            --text-light: #6c757d;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            color: var(--text);
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .card-header {
            background-color: var(--primary);
            color: white;
            padding: 1.25rem;
            border-bottom: none;
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 0.25rem rgba(230, 57, 70, 0.15);
        }

        .btn {
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: var(--secondary);
            border-color: var(--secondary);
        }

        .btn-success {
            background-color: var(--success);
            border-color: var(--success);
        }

        .btn-danger {
            background-color: var(--danger);
            border-color: var(--danger);
        }

        .table {
            border-radius: 12px;
            overflow: hidden;
        }

        .table thead {
            background-color: var(--primary);
            color: white;
        }

        .table th {
            border-bottom: none;
            font-weight: 500;
        }

        .table td {
            vertical-align: middle;
        }

        .action-btns .btn {
            padding: 5px 10px;
            margin: 0 3px;
        }

        .form-label {
            font-weight: 500;
            color: var(--dark);
        }

        .page-title {
            color: var(--dark);
            font-weight: 600;
            margin-bottom: 30px;
            position: relative;
            padding-bottom: 10px;
        }

        .page-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 60px;
            height: 3px;
            background-color: var(--primary);
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-active {
            background-color: rgba(42, 157, 143, 0.1);
            color: var(--success);
        }

        .status-inactive {
            background-color: rgba(231, 111, 81, 0.1);
            color: var(--danger);
        }

        @media (max-width: 768px) {
            .btn {
                margin-bottom: 10px;
                width: 100%;
            }
        }

            width: 90%;
            max-width: 1200px;

            background-color: var(--white);
            border-radius: 20px;
            box-shadow:
                    0 15px 25px rgba(0, 0, 0, 0.1),
                    0 5px 10px rgba(0, 0, 0, 0.05),
                    0 0 0 1px rgba(0, 0, 0, 0.02);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            animation: fadeInUp 0.8s ease-out;
        }

        .container:hover{
            box-shadow:
                    0 15px 25px rgba(10, 0, 0, 10.1),
                    0 5px 10px rgba(0, 0, 0, 0.05),
                    0 0 0 1px rgba(0, 0, 0, 0.02);
        }*/

    </style>

</head>
<body>

<div class="container py-5">
    <h1 class="page-title">User Management</h1>

    <div class="row">
        <div class="col-lg-6">
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-user-edit me-2"></i>User Details</h5>
                </div>
                <div class="card-body">
                    <form id="employeeForm">
                        <div class="mb-3">
                            <label for="userId" class="form-label">User Id : </label>
                            <input type="text" class="form-control" id="userId" placeholder="User Id : " disabled>
                        </div>

                        <div class="mb-3">
                            <label for="userName" class="form-label">User Name : </label>
                            <input type="text" class="form-control" id="userName" placeholder="User Name : ">
                        </div>

                        <div class="mb-3">
                            <label for="select-role" class="form-label">Select Role : </label>
                            <select id="select-role" class="form-select"></select>
                        </div>

                        <div class="mb-3">
                            <label for="userEmail" class="form-label">Email : </label>
                            <input type="text" class="form-control" id="userEmail" placeholder="Email : ">
                        </div>

                        <div class="mb-3">
                            <label for="userMobile" class="form-label">Mobile : </label>
                            <input type="text" class="form-control" id="userMobile" placeholder="Mobile : ">
                        </div>

                        <div class="mb-3">
                            <label for="userAddress" class="form-label">Address : </label>
                            <input type="text" class="form-control" id="userAddress" placeholder="Address : ">
                        </div>

                        <div class="mb-3">
                            <label for="userPassword" class="form-label">Password : </label>
                            <input type="text" class="form-control" id="userPassword" placeholder="Address : ">
                        </div>

                        <div class="mb-3">
                            <label for="userPassword-ii" class="form-label">Re-enter Password : </label>
                            <input type="text" class="form-control" id="userPassword-ii" placeholder="Re-enter Password : ">
                        </div>


                        <div class="d-flex flex-wrap gap-2 mt-4">
                            <button type="button" class="btn btn-primary" onclick="saveUser()">Save</button>
                            <button type="button" class="btn btn-secondary" onclick="updateUser()">Update</button>
                            <button type="button" class="btn btn-success" onclick="deleteUser()">Delete</button>
                            <button type="button" class="btn btn-success" onclick="getAllUsers()">Load Table</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="fas fa-users me-2"></i>USer Records</h5>
                    <div class="input-group" style="width: 200px;">
                        <input type="text" class="form-control" id="searchInput" placeholder="Search By Name...">
                        <button class="btn btn-outline-light" type="button">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th scope="col">User Id</th>
                                <th scope="col">User Name</th>
                                <th scope="col">Role</th>
                                <th scope="col">Email</th>
                                <th scope="col">Mobile</th>
                                <th scope="col">Address</th>
                                <th>Action</th>

                            </tr>
                            </thead>
                            <tbody id="userTable">

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/userManagement.js"></script>
</body>
</html>
