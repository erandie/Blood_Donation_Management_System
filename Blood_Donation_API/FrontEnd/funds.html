<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/funds.js"></script>

<body>

<div class="container mt-5 col-6">
  <div class="mb-3">
    <label for="exampleFormControlInput19" class="form-label">Funds Id : </label>
    <input type="text" class="form-control" id="exampleFormControlInput19" placeholder="Funds Id : " disabled>
  </div>

  <div class="mb-3">
    <label for="exampleFormControlInput20" class="form-label">Description : </label>
    <input type="text" class="form-control" id="exampleFormControlInput20" placeholder="Description : ">
  </div>

  <div class="mb-3">
    <label for="exampleFormControlInput21" class="form-label">Amount : </label>
    <input type="email" class="form-control" id="exampleFormControlInput21" placeholder="amount : ">
  </div>

  <div class="mb-3">
    <label for="select-paymentMethode" class="form-label">Select Payment Methode : </label>
    <select id="select-paymentMethode" class="form-select">
    </select>
  </div>

  <div class="mb-3">
    <label for="select-donorID" class="form-label">Select Donor ID : </label>
    <select id="select-donorID" class="form-select"></select>
  </div>

  <div class="mb-3">
    <label for="select-patientID" class="form-label">Select Patient ID : </label>
    <select id="select-patientID" class="form-select"></select>
  </div>

  <div>
    <button type="button" class="btn btn-primary" onclick="saveFunds()">Save</button>
    <button type="button" class="btn btn-secondary" onclick="updateFunds()">Update</button>
    <button type="button" class="btn btn-success" onclick="deleteFunds()">Delete</button>
    <button type="button" class="btn btn-success" onclick="getAllFunds()">Load Table</button>
  </div>

  <div class="mt-3">
    <table class="table">
      <thead>
      <tr>
        <th scope="col">Funds Id</th>
        <th scope="col">Description</th>
        <th scope="col">Amount</th>
        <th scope="col">Payment Methode</th>
        <th scope="col">Donor ID</th>
        <th scope="col">Patient ID</th>
      </tr>
      </thead>
      <tbody id="fundsTable">

      </tbody>
    </table>

  </div>

</div>

</body>
</html>
