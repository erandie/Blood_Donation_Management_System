<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management | FairyCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e63946;
            --primary-light: #ff758f;
            --secondary: #457b9d;
            --dark: #1d3557;
            --light: #f1faee;
            --success: #2a9d8f;
            --warning: #e9c46a;
            --danger: #e76f51;
            --white: #ffffff;
            --gray: #f8f9fa;
            --text: #333333;
            --text-light: #6c757d;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            color: var(--text);
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .card-header {
            background-color: var(--primary);
            color: white;
            padding: 1.25rem;
            border-bottom: none;
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 0.25rem rgba(230, 57, 70, 0.15);
        }

        .btn {
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: var(--secondary);
            border-color: var(--secondary);
        }

        .btn-success {
            background-color: var(--success);
            border-color: var(--success);
        }

        .btn-danger {
            background-color: var(--danger);
            border-color: var(--danger);
        }

        .table {
            border-radius: 12px;
            overflow: hidden;
        }

        .table thead {
            background-color: var(--primary);
            color: white;
        }

        .table th {
            border-bottom: none;
            font-weight: 500;
        }

        .table td {
            vertical-align: middle;
        }

        .action-btns .btn {
            padding: 5px 10px;
            margin: 0 3px;
        }

        .form-label {
            font-weight: 500;
            color: var(--dark);
        }

        .page-title {
            color: var(--dark);
            font-weight: 600;
            margin-bottom: 30px;
            position: relative;
            padding-bottom: 10px;
        }

        .page-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 60px;
            height: 3px;
            background-color: var(--primary);
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-active {
            background-color: rgba(42, 157, 143, 0.1);
            color: var(--success);
        }

        .status-inactive {
            background-color: rgba(231, 111, 81, 0.1);
            color: var(--danger);
        }

        @media (max-width: 768px) {
            .btn {
                margin-bottom: 10px;
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container py-5">
    <h1 class="page-title">Employee Management</h1>

    <div class="row">
        <div class="col-lg-6">
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0"><i class="fas fa-user-edit me-2"></i>Employee Details</h5>
                </div>
                <div class="card-body">
                    <form id="employeeForm">
                        <div class="mb-3">
                            <label for="employeeId" class="form-label">Employee ID</label>
                            <input type="text" class="form-control" id="employeeId" placeholder="Auto-generated" disabled>
                        </div>

                        <div class="mb-3">
                            <label for="employeeName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="employeeName" placeholder="Enter employee name" required>
                        </div>

                        <div class="mb-3">
                            <label for="employeeContact" class="form-label">Contact Number</label>
                            <input type="tel" class="form-control" id="employeeContact" placeholder="Enter contact number" required>
                        </div>

                        <div class="mb-3">
                            <label for="employeeAddress" class="form-label">Address</label>
                            <input type="text" class="form-control" id="employeeAddress" placeholder="Enter address" required>
                        </div>

                        <div class="mb-3">
                            <label for="bloodBank" class="form-label">Blood Bank</label>
                            <select id="bloodBank" class="form-select" required>
                                <option value="" selected disabled>Select blood bank</option>
                                <!-- Options will be populated by JavaScript -->
                            </select>
                        </div>

                        <div class="d-flex flex-wrap gap-2 mt-4">
                            <button type="button" class="btn btn-primary" onclick="saveEmployee()">
                                <i class="fas fa-save me-2"></i>Save
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="updateEmployee()">
                                <i class="fas fa-sync-alt me-2"></i>Update
                            </button>
                            <button type="button" class="btn btn-danger" onclick="deleteEmployee()">
                                <i class="fas fa-trash-alt me-2"></i>Delete
                            </button>
                            <button type="button" class="btn btn-success" onclick="getAllEmployee()">
                                <i class="fas fa-redo me-2"></i>Refresh
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="fas fa-users me-2"></i>Employee Records</h5>
                    <div class="input-group" style="width: 200px;">
                        <input type="text" class="form-control" placeholder="Search...">
                        <button class="btn btn-outline-light" type="button">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Contact</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody id="employeeTable">
                            <!-- Table rows will be populated by JavaScript -->
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">
                                    No employee records found. Click "Refresh" to load data.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/Employee.js"></script>

<script>
    // Sample function to populate the blood bank dropdown
    function populateBloodBanks() {
        const bloodBankSelect = document.getElementById('bloodBank');

        // Sample data - replace with your actual data
        const bloodBanks = [
            { id: 1, name: "FairyCare Central Blood Bank" },
            { id: 2, name: "City General Hospital Blood Center" },
            { id: 3, name: "Red Crescent Blood Donation Center" },
            { id: 4, name: "LifeBlood Regional Center" }
        ];

        bloodBanks.forEach(bank => {
            const option = document.createElement('option');
            option.value = bank.id;
            option.textContent = bank.name;
            bloodBankSelect.appendChild(option);
        });
    }

    // Call the function when the page loads
    document.addEventListener('DOMContentLoaded', populateBloodBanks);
</script>
</body>
</html>
