<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/Patient.js"></script>
<body>

<div class="container mt-5 col-6">
    <div class="mb-3">
        <label for="exampleFormControlInput15" class="form-label">Patient Id : </label>
        <input type="text" class="form-control" id="exampleFormControlInput15" placeholder="Patient Id : " disabled>
    </div>

    <div class="mb-3">
        <label for="exampleFormControlInput16" class="form-label">Patient Name : </label>
        <input type="text" class="form-control" id="exampleFormControlInput16" placeholder="Patient Name : ">
    </div>

    <div class="mb-3">
        <label for="exampleFormControlInput17" class="form-label">email : </label>
        <input type="email" class="form-control" id="exampleFormControlInput17" placeholder="email : ">
    </div>

    <div class="mb-3">
        <label for="exampleFormControlInput18" class="form-label">Address : </label>
        <input type="text" class="form-control" id="exampleFormControlInput18" placeholder="Address : ">
    </div>
    <div class="mb-3">
        <label for="select-bloodBank" class="form-label">Select Blood Bank : </label>
        <select id="select-bloodBank" class="form-select"></select>
    </div>

    <div>
        <button type="button" class="btn btn-primary" onclick="savePatient()">Save</button>
        <button type="button" class="btn btn-secondary" onclick="updatePatient()">Update</button>
        <button type="button" class="btn btn-success" onclick="deletePatient()">Delete</button>
        <button type="button" class="btn btn-success" onclick="getAllPatient()">Load Table</button>
    </div>

    <div class="mt-3">
        <table class="table">
            <thead>
            <tr>
                <th scope="col">Patient Id</th>
                <th scope="col">Patient Name</th>
                <th scope="col">email</th>
                <th scope="col">Address</th>
                <th scope="col">Blood Bank ID</th>
            </tr>
            </thead>
            <tbody id="patientTable">

            </tbody>
        </table>

    </div>

</div>

</body>
</html>
