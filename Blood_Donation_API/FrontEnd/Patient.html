<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        :root {
            --primary: #e63946;
            --primary-light: #ff758f;
            --secondary: #457b9d;
            --dark: #1d3557;
            --light: #f1faee;
            --success: #2a9d8f;
            --warning: #e9c46a;
            --danger: #e76f51;
            --white: #ffffff;
            --gray: #f8f9fa;
            --text: #333333;
            --text-light: #6c757d;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            color: var(--text);
        }

        .logo-text span {
            color: var(--primary);
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .card-header {
            background-color: var(--primary);
            color: white;
            padding: 1.25rem;
            border-bottom: none;
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 0.25rem rgba(230, 57, 70, 0.15);
        }

        .btn {
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: var(--secondary);
            border-color: var(--secondary);
        }

        .btn-success {
            background-color: var(--success);
            border-color: var(--success);
        }

        .btn-danger {
            background-color: var(--danger);
            border-color: var(--danger);
        }

        .table {
            border-radius: 12px;
            overflow: hidden;
        }

        .table thead {
            background-color: var(--primary);
            color: white;
        }

        .table th {
            border-bottom: none;
            font-weight: 500;
        }

        .table td {
            vertical-align: middle;
        }

        .action-btns .btn {
            padding: 5px 10px;
            margin: 0 3px;
        }

        .form-label {
            font-weight: 500;
            color: var(--dark);
        }

        .page-title {
            color: var(--dark);
            font-weight: 600;
            margin-bottom: 30px;
            position: relative;
            padding-bottom: 10px;
        }

        .page-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 60px;
            height: 3px;
            background-color: var(--primary);
        }

        @media (max-width: 768px) {
            .btn {
                margin-bottom: 10px;
                width: 100%;
            }
        }
    </style>

</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/jquery-3.7.1.min.js"></script>
<script src="js/Patient.js"></script>
<body>

<div class="container py-5">
        <h1 class="page-title">Manage Patients</h1>

        <div class="row">
            <div class="col-lg-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-user-edit me-2"></i>Patient Details</h5>
                    </div>
                    <div class="card-body">
                        <form id="employeeForm">
                            <div class="mb-3">
                                <label for="exampleFormControlInput15" class="form-label">Patient Id : </label>
                                <input type="text" class="form-control" id="exampleFormControlInput15" placeholder="Patient Id : " disabled>
                            </div>

                            <div class="mb-3">
                                <label for="exampleFormControlInput16" class="form-label">Patient Name : </label>
                                <input type="text" class="form-control" id="exampleFormControlInput16" placeholder="Patient Name : ">
                            </div>

                            <div class="mb-3">
                                <label for="exampleFormControlInput17" class="form-label">email : </label>
                                <input type="email" class="form-control" id="exampleFormControlInput17" placeholder="email : ">
                            </div>

                            <div class="mb-3">
                                <label for="exampleFormControlInput18" class="form-label">Address : </label>
                                <input type="text" class="form-control" id="exampleFormControlInput18" placeholder="Address : ">
                            </div>
                            <div class="mb-3">
                                <label for="select-bloodBank" class="form-label">Select Blood Bank : </label>
                                <select id="select-bloodBank" class="form-select"></select>
                            </div>

                            <div>
                                <button type="button" class="btn btn-primary" onclick="savePatient()">Save</button>
                                <button type="button" class="btn btn-secondary" onclick="updatePatient()">Update</button>
                                <button type="button" class="btn btn-success" onclick="deletePatient()">Delete</button>
                                <button type="button" class="btn btn-success" onclick="getAllPatient()">Load Table</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-users me-2"></i>Patient Records</h5>
                        <div class="input-group" style="width: 200px;">
                            <input type="text" class="form-control" id="searchInput" placeholder="Search Patients...">
                            <button class="btn btn-outline-light" type="button">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                <tr>
                                    <th scope="col">Patient Id</th>
                                    <th scope="col">Patient Name</th>
                                    <th scope="col">email</th>
                                    <th scope="col">Address</th>
                                    <th scope="col">Blood Bank ID</th>
                                </tr>
                                </thead>
                                <tbody id="patientTable">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
</div>
</body>
</html>
